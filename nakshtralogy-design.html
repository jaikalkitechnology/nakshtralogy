<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nakshtralogy — Design System & Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* === NAKSHTRALOGY COLOR SYSTEM === */
    /* Primary - Deep cosmic */
    --midnight: #0B0B2E;
    --cosmic-void: #06061A;
    --nebula: #1A1642;
    --twilight: #2D2458;

    /* Accent - Celestial gold & saffron */
    --gold: #E8B547;
    --gold-bright: #F4CC6B;
    --saffron: #E07A3C;
    --rose-gold: #D4896B;

    /* Mystical secondary */
    --lavender: #B8A7E0;
    --indigo: #4A3B8C;
    --cosmic-pink: #E8689C;
    --aurora: #7BC4C4;

    /* Neutrals */
    --ivory: #F5EEE0;
    --parchment: #EDE4D0;
    --smoke: #8A8298;
    --ash: #3A3550;

    /* Semantic */
    --success: #6BB88A;
    --danger: #D95555;
    --warning: #E8B547;

    /* Gradients */
    --grad-cosmos: linear-gradient(135deg, #0B0B2E 0%, #2D2458 50%, #4A3B8C 100%);
    --grad-gold: linear-gradient(135deg, #E8B547 0%, #F4CC6B 50%, #E07A3C 100%);
    --grad-aurora: linear-gradient(135deg, #4A3B8C 0%, #E8689C 50%, #E8B547 100%);
    --grad-dusk: linear-gradient(180deg, #1A1642 0%, #0B0B2E 100%);

    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Manrope', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--cosmic-void);
    color: var(--ivory);
    overflow-x: hidden;
    line-height: 1.5;
  }

  /* Starfield background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(1px 1px at 20% 30%, white, transparent),
      radial-gradient(1px 1px at 60% 70%, white, transparent),
      radial-gradient(2px 2px at 80% 20%, rgba(232,181,71,0.6), transparent),
      radial-gradient(1px 1px at 40% 90%, white, transparent),
      radial-gradient(1px 1px at 90% 50%, rgba(184,167,224,0.8), transparent),
      radial-gradient(2px 2px at 15% 60%, rgba(232,181,71,0.4), transparent),
      radial-gradient(1px 1px at 50% 10%, white, transparent);
    background-size: 200% 200%;
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
  }

  .wrapper { position: relative; z-index: 1; }

  /* === HEADER === */
  .hero {
    padding: 80px 40px 60px;
    text-align: center;
    background: radial-gradient(ellipse at top, rgba(74,59,140,0.3), transparent 70%);
    border-bottom: 1px solid rgba(232,181,71,0.15);
  }

  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .hero h1 {
    font-family: var(--font-display);
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 0.95;
    margin-bottom: 20px;
    background: linear-gradient(180deg, #F5EEE0 0%, #E8B547 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero h1 em {
    font-style: italic;
    color: var(--gold-bright);
    -webkit-text-fill-color: var(--gold-bright);
  }

  .hero p {
    max-width: 560px;
    margin: 0 auto;
    color: var(--lavender);
    font-size: 17px;
  }

  .divider-star {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 32px 0;
    color: var(--gold);
  }

  .divider-star .line {
    height: 1px;
    width: 80px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* === SECTION === */
  .section {
    max-width: 1400px;
    margin: 0 auto;
    padding: 80px 40px;
  }

  .section-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .section-title {
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
    color: var(--ivory);
  }

  .section-title em {
    font-style: italic;
    color: var(--gold);
  }

  .section-sub {
    color: var(--smoke);
    font-size: 16px;
    margin-bottom: 48px;
    max-width: 600px;
  }

  /* === COLOR PALETTE === */
  .palette {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
  }

  .swatch {
    background: var(--nebula);
    border: 1px solid rgba(232,181,71,0.1);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.3s, border-color 0.3s;
  }

  .swatch:hover { transform: translateY(-4px); border-color: rgba(232,181,71,0.4); }

  .swatch-color {
    height: 120px;
    position: relative;
  }

  .swatch-info {
    padding: 16px;
  }

  .swatch-name {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .swatch-hex {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--smoke);
    letter-spacing: 0.05em;
  }

  /* === TYPOGRAPHY DISPLAY === */
  .type-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }

  .type-card {
    background: var(--nebula);
    border: 1px solid rgba(232,181,71,0.1);
    border-radius: 24px;
    padding: 40px;
  }

  .type-card-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .type-sample-display {
    font-family: var(--font-display);
    font-size: 64px;
    font-weight: 500;
    line-height: 1;
    color: var(--ivory);
    margin-bottom: 8px;
  }

  .type-sample-display em { font-style: italic; color: var(--gold); }

  .type-sample-body {
    font-family: var(--font-body);
    font-size: 28px;
    font-weight: 400;
    color: var(--ivory);
    margin-bottom: 8px;
  }

  .type-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--smoke);
    letter-spacing: 0.05em;
  }

  /* === SCREENS GRID === */
  .screens-intro {
    text-align: center;
    margin-bottom: 60px;
  }

  .screen-group-label {
    display: inline-block;
    padding: 8px 24px;
    background: linear-gradient(135deg, rgba(232,181,71,0.15), rgba(224,122,60,0.1));
    border: 1px solid rgba(232,181,71,0.3);
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  .screens-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 32px;
    margin-bottom: 100px;
  }

  .screen-card {
    text-align: center;
  }

  .screen-title {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 600;
    margin-top: 20px;
    margin-bottom: 4px;
  }

  .screen-desc {
    color: var(--smoke);
    font-size: 13px;
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
  }

  /* === PHONE FRAME === */
  .phone {
    width: 320px;
    height: 680px;
    margin: 0 auto;
    background: #000;
    border-radius: 44px;
    padding: 12px;
    box-shadow:
      0 40px 80px -20px rgba(74,59,140,0.5),
      0 0 0 2px rgba(232,181,71,0.15),
      inset 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
  }

  .phone::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 26px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 10;
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 32px;
    overflow: hidden;
    position: relative;
    background: var(--cosmic-void);
  }

  /* === STATUS BAR === */
  .status-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px 0 28px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ivory);
    position: relative;
    z-index: 5;
  }

  .status-bar .right { display: flex; gap: 6px; align-items: center; }

  /* === COMMON SCREEN STYLES === */
  .screen {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    font-size: 11px;
  }

  .screen-bg-cosmos {
    background:
      radial-gradient(ellipse at top, rgba(74,59,140,0.6), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(232,104,156,0.2), transparent 50%),
      var(--cosmic-void);
  }

  .screen-bg-cosmos::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(1px 1px at 20% 15%, white, transparent),
      radial-gradient(1px 1px at 70% 25%, rgba(232,181,71,0.8), transparent),
      radial-gradient(1px 1px at 40% 45%, white, transparent),
      radial-gradient(1px 1px at 85% 60%, rgba(184,167,224,0.8), transparent),
      radial-gradient(2px 2px at 15% 75%, rgba(232,181,71,0.5), transparent),
      radial-gradient(1px 1px at 60% 85%, white, transparent);
    opacity: 0.6;
  }

  .screen-content { position: relative; z-index: 2; padding: 0 20px; }

  .nav-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    position: relative;
    z-index: 3;
  }

  .nav-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
  }

  .nav-title em { font-style: italic; color: var(--gold); }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(232,181,71,0.2);
    color: var(--ivory);
  }

  /* === USER SCREEN 1: HOME === */
  .hero-banner {
    margin: 12px 20px;
    padding: 18px;
    border-radius: 20px;
    background:
      linear-gradient(135deg, rgba(232,181,71,0.2), rgba(224,122,60,0.15) 50%, rgba(74,59,140,0.3)),
      radial-gradient(circle at 80% 20%, rgba(232,181,71,0.3), transparent 60%);
    border: 1px solid rgba(232,181,71,0.3);
    position: relative;
    overflow: hidden;
  }

  .hero-banner::after {
    content: '✦';
    position: absolute;
    top: 8px; right: 16px;
    font-size: 40px;
    color: rgba(232,181,71,0.3);
  }

  .banner-eyebrow {
    font-family: var(--font-mono);
    font-size: 8px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .banner-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .banner-title em { font-style: italic; color: var(--gold); }

  .banner-sub {
    font-size: 10px;
    color: var(--lavender);
  }

  .quick-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 16px 20px;
  }

  .quick-action {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(232,181,71,0.15);
    border-radius: 14px;
    padding: 12px 6px;
    text-align: center;
  }

  .qa-icon {
    width: 32px; height: 32px;
    margin: 0 auto 6px;
    background: linear-gradient(135deg, var(--gold), var(--saffron));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .qa-label {
    font-size: 8px;
    color: var(--ivory);
    font-weight: 500;
  }

  .section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 16px 20px 10px;
  }

  .sh-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
  }

  .sh-link {
    font-size: 9px;
    color: var(--gold);
    font-family: var(--font-mono);
    letter-spacing: 0.1em;
  }

  .astrologer-list {
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .astrologer-card {
    background: rgba(26,22,66,0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(232,181,71,0.15);
    border-radius: 16px;
    padding: 12px;
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .astrologer-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--saffron), var(--cosmic-pink));
    position: relative;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 18px;
    border: 2px solid var(--gold);
  }

  .astrologer-avatar::after {
    content: '';
    position: absolute;
    bottom: 1px; right: 1px;
    width: 10px; height: 10px;
    background: var(--success);
    border: 2px solid var(--midnight);
    border-radius: 50%;
  }

  .astrologer-info { flex: 1; }

  .astrologer-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--ivory);
    margin-bottom: 2px;
  }

  .astrologer-spec {
    font-size: 9px;
    color: var(--smoke);
    margin-bottom: 3px;
  }

  .astrologer-stats {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .stat-pill {
    font-size: 8px;
    color: var(--gold);
    font-family: var(--font-mono);
  }

  .cta-mini {
    background: linear-gradient(135deg, var(--gold), var(--saffron));
    color: var(--midnight);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  /* === BOTTOM NAV === */
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 70px;
    background: rgba(11,11,46,0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(232,181,71,0.15);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 16px 14px;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 8px;
    color: var(--smoke);
  }

  .nav-item.active { color: var(--gold); }

  .nav-item svg { width: 20px; height: 20px; }

  /* === USER SCREEN 2: KUNDLI === */
  .kundli-container {
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .kundli-chart {
    width: 260px; height: 260px;
    margin: 16px 0;
    position: relative;
  }

  .kundli-svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 0 20px rgba(232,181,71,0.3));
  }

  .kundli-info-card {
    background: rgba(26,22,66,0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(232,181,71,0.2);
    border-radius: 16px;
    padding: 14px;
    width: 100%;
    margin-top: 12px;
  }

  .kundli-info-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    font-size: 10px;
    border-bottom: 1px solid rgba(232,181,71,0.08);
  }

  .kundli-info-row:last-child { border: 0; }

  .kundli-info-row .label { color: var(--smoke); }
  .kundli-info-row .value { color: var(--gold); font-weight: 600; }

  /* === USER SCREEN 3: AI CHAT === */
  .ai-chat-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    height: calc(100% - 140px);
    overflow: hidden;
  }

  .chat-bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 11px;
    line-height: 1.4;
  }

  .chat-bubble.ai {
    background: rgba(74,59,140,0.4);
    border: 1px solid rgba(184,167,224,0.3);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  .chat-bubble.user {
    background: linear-gradient(135deg, var(--gold), var(--saffron));
    color: var(--midnight);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }

  .ai-avatar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
  }

  .ai-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, var(--gold-bright), var(--saffron)),
      conic-gradient(from 0deg, var(--gold), var(--cosmic-pink), var(--indigo), var(--gold));
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--midnight);
    font-weight: 700;
    border: 2px solid rgba(232,181,71,0.5);
  }

  .ai-name {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
  }

  .ai-status {
    font-size: 9px;
    color: var(--success);
    font-family: var(--font-mono);
  }

  .chat-input {
    position: absolute;
    bottom: 70px; left: 12px; right: 12px;
    background: rgba(26,22,66,0.9);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(232,181,71,0.2);
    border-radius: 999px;
    padding: 8px 8px 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chat-input input {
    flex: 1;
    background: transparent;
    border: 0;
    color: var(--ivory);
    font-size: 11px;
    outline: none;
  }

  .send-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--saffron));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--midnight);
    border: 0;
  }

  .chat-suggestions {
    padding: 0 16px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .suggestion {
    font-size: 9px;
    padding: 5px 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(232,181,71,0.2);
    border-radius: 999px;
    color: var(--lavender);
  }

  /* === USER SCREEN 4: LIVE STREAM === */
  .live-stream-bg {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, #3A1F5C 0%, #6B2C5C 50%, #1A1642 100%),
      radial-gradient(circle at 30% 40%, rgba(232,104,156,0.4), transparent 50%);
  }

  .live-stream-bg::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, transparent, rgba(11,11,46,0.9));
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--danger);
    color: white;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .live-badge::before {
    content: '';
    width: 6px; height: 6px;
    background: white;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse { 50% { opacity: 0.3; } }

  .viewer-count {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    color: white;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 9px;
    font-weight: 600;
  }

  .stream-top {
    position: absolute;
    top: 50px; left: 16px; right: 16px;
    display: flex;
    justify-content: space-between;
    z-index: 3;
  }

  .streamer-info {
    position: absolute;
    top: 90px; left: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 3;
  }
