name: nakshatralogy_user
description: "Nakshtralogy - Vedic Astrology for everyone"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  image_picker: ^1.0.7
  file_picker: ^8.1.2
  shared_preferences: ^2.2.2
  google_sign_in: ^6.2.1
  web_socket_channel: ^3.0.0
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.3.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.2.5
  # Cross-platform PDF share/print/download (mobile + web) for report exports.
  printing: ^5.13.0
  # Native Razorpay Checkout on mobile (web uses checkout.js via JS interop).
  razorpay_flutter: ^1.3.7
  app_links: ^6.3.0
  local_auth: ^2.3.0
  # International paid digital goods → store IAP tiers (App Store / Google Play).
  in_app_purchase: ^3.2.0
  # Google Play In-App Update — prompts to update when a newer version is live.
  in_app_update: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  adaptive_icon_background: "assets/icon/ic_launcher_background.png"
  min_sdk_android: 21
