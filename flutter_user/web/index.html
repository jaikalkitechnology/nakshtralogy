<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nakshatralogy — personalized Vedic astrology: kundli, dashas, daily horoscopes, and live consultations with expert astrologers.">
  <meta name="theme-color" content="#0A0A24">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nakshatralogy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nakshatralogy — Vedic Astrology</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Branded PWA install banner (desktop Chrome/Edge) + iOS A2HS hint. */
    #nk-install-banner {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      z-index: 2147483000; display: none; align-items: center; gap: 14px;
      max-width: 92%; padding: 12px 16px; border-radius: 14px;
      background: #12123a; color: #F6F1E7;
      border: 1px solid rgba(214,178,94,0.45);
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.35;
    }
    #nk-install-banner img { width: 34px; height: 34px; border-radius: 8px; }
    #nk-install-banner .nk-text { flex: 1 1 auto; }
    #nk-install-banner button {
      cursor: pointer; border: none; border-radius: 10px;
      padding: 9px 14px; font-weight: 600; font-size: 13px;
    }
    #nk-install-btn { background: #D6B25E; color: #0A0A24; }
    #nk-install-dismiss { background: transparent; color: #9aa0b4; padding: 9px 6px; }
    /* Branded startup splash — replaces the blank white screen while Flutter
       boots. Removed on the first rendered frame. */
    #nk-splash {
      position: fixed; inset: 0; z-index: 2147483646;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, #15152e 0%, #0B0B1F 70%);
      transition: opacity .5s ease; opacity: 1;
    }
    #nk-splash.nk-hide { opacity: 0; pointer-events: none; }
    .nk-splash-wrap { position: relative; width: 128px; height: 128px; display: flex; align-items: center; justify-content: center; }
    .nk-splash-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid rgba(212,175,55,0.15); border-top-color: #D4AF37;
      animation: nk-spin 1s linear infinite;
    }
    .nk-splash-icon { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.5); animation: nk-pulse 1.6s ease-in-out infinite; }
    .nk-splash-title { margin-top: 24px; color: #E8B547; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 3px; }
    .nk-splash-sub { margin-top: 6px; color: #8888a0; font-size: 12px; letter-spacing: .5px; }
    @keyframes nk-spin { to { transform: rotate(360deg); } }
    @keyframes nk-pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.92); opacity: .85; } }
  </style>
</head>
<body>
  <!-- Branded loading splash (hidden once Flutter renders its first frame) -->
  <div id="nk-splash">
    <div class="nk-splash-wrap">
      <div class="nk-splash-ring"></div>
      <img class="nk-splash-icon" src="icons/Icon-256.png" alt="Nakshatralogy"/>
    </div>
    <div class="nk-splash-title">NAKSHATRALOGY</div>
    <div class="nk-splash-sub">Your cosmic journey · loading…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('nk-splash');
      if (s) { s.classList.add('nk-hide'); setTimeout(function () { s.remove(); }, 600); }
    });
  </script>
  <!-- PWA install banner (hidden until beforeinstallprompt fires, or iOS Safari). -->
  <div id="nk-install-banner" role="dialog" aria-label="Install Nakshatralogy">
    <img src="icons/Icon-192.png" alt="Nakshatralogy"/>
    <div class="nk-text" id="nk-install-text">Install Nakshatralogy for a faster, full-screen experience.</div>
    <button id="nk-install-btn">Install</button>
    <button id="nk-install-dismiss" aria-label="Dismiss">&times;</button>
  </div>

  <script>
    (function () {
      var banner = document.getElementById('nk-install-banner');
      var installBtn = document.getElementById('nk-install-btn');
      var dismissBtn = document.getElementById('nk-install-dismiss');
      var textEl = document.getElementById('nk-install-text');
      var deferredPrompt = null;
      var DISMISS_KEY = 'nk_install_dismissed';

      function alreadyInstalled() {
        return window.matchMedia('(display-mode: standalone)').matches ||
               window.navigator.standalone === true;
      }
      function dismissed() {
        try { return localStorage.getItem(DISMISS_KEY) === '1'; } catch (e) { return false; }
      }
      function hide() { banner.style.display = 'none'; }
      function show() { banner.style.display = 'flex'; }

      dismissBtn.addEventListener('click', function () {
        hide();
        try { localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
      });

      // Desktop Chrome/Edge: capture the event, prevent the mini-infobar, show
      // our branded banner; on click call prompt().
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        if (alreadyInstalled() || dismissed()) return;
        installBtn.textContent = 'Install';
        installBtn.style.display = '';
        show();
      });

      installBtn.addEventListener('click', function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () {
          deferredPrompt = null;
          hide();
        });
      });

      window.addEventListener('appinstalled', function () {
        hide();
        deferredPrompt = null;
      });

      // iOS Safari fires no beforeinstallprompt — show a manual A2HS hint.
      function isIosSafari() {
        var ua = window.navigator.userAgent;
        var iOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        var webkit = /WebKit/.test(ua);
        var notOtherBrowser = !/(CriOS|FxiOS|OPiOS|EdgiOS)/.test(ua);
        return iOS && webkit && notOtherBrowser;
      }
      if (isIosSafari() && !alreadyInstalled() && !dismissed()) {
        textEl.textContent = 'Add to Home Screen: tap Share, then "Add to Home Screen".';
        installBtn.style.display = 'none';
        show();
      }
    })();
  </script>

  <!--
    Agora Web SDK (iris-web) — REQUIRED for agora_rtc_engine on Flutter Web.
    Without this bridge, createAgoraRtcEngine().initialize() fails in the browser
    and audio/video calls + live viewing silently fall back to "unsupported".
    The build number MUST match the resolved agora_rtc_engine version
    (pubspec.lock = 6.5.3 → iris n450_w4220_0.8.6). Loaded before the Flutter
    bootstrap so the SDK is present when the engine initialises.
  -->
  <script src="https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js"></script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
