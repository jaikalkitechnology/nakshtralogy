server {
    listen 80;
    listen 443 ssl;
    server_name api.nakshatralogy.com;

    # SSL certs (update paths for your server)
    # ssl_certificate     /etc/letsencrypt/live/api.nakshatralogy.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.nakshatralogy.com/privkey.pem;

    # ── Fix "Request Entity Too Large" (413) ──
    client_max_body_size 10M;

    # ── WebSocket: /ws/ paths ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Required for WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WS alive for long streaming responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── API: everything else ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Also needed for large kundli payloads
        client_max_body_size 10M;
    }
}
root /var/www/admin_naksha;dev_naksha, astro_naksha, app_naksha