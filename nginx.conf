server {
    listen 80;
    listen 443 ssl;
    server_name api.nakshatralogy.com;

    # SSL certs (update paths for your server)
    # ssl_certificate     /etc/letsencrypt/live/api.nakshatralogy.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.nakshatralogy.com/privkey.pem;

    # ── Fix "Request Entity Too Large" (413) ──
    client_max_body_size 10M;

    # ── WebSocket: /ws/ paths ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Required for WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WS alive for long streaming responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── API: everything else ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Also needed for large kundli payloads
        client_max_body_size 10M;
    }
}

# NOTE: this file only covers the api.nakshatralogy.com vhost (the
# backend). admin.nakshatralogy.com (root /var/www/admin_naksha),
# app.nakshatralogy.com (root /var/www/app_naksha), and any dev/astro
# subdomains (dev_naksha, astro_naksha) are served from their own
# separate static-file server blocks — check /etc/nginx/sites-available/
# on the server for those. They are NOT in this repo file.
#
# The line that used to be here ("root /var/www/admin_naksha;dev_naksha,
# astro_naksha, app_naksha") was outside any server{} block — invalid
# nginx syntax. If this exact file (with that line) is what's deployed
# at /etc/nginx/sites-enabled/, `nginx -t` has been failing and every
# `nginx reload` since has been a no-op, silently keeping whatever config
# was last loaded successfully. Run `sudo nginx -t` on the server to
# check before assuming any nginx-level change (including the /ws/
# block above) has actually taken effect.