# ── Hindustani Jyotish · nginx reverse proxy ──────────────────────────────
# TLS termination + reverse proxy to the gunicorn/uvicorn upstream, with the
# WebSocket upgrade wired through so 1:1 consultation chat and live-stream chat
# survive the proxy hop.
#
# Install: /etc/nginx/sites-available/hindustani_jyotish  (symlink into
# sites-enabled), then `nginx -t && systemctl reload nginx`.
# TLS certs below are managed by certbot (`certbot --nginx -d <host>`).
#
# !! THE HOSTNAME MUST MATCH WHAT THE APPS ACTUALLY CALL !!
# The Flutter apps default to https://fastapi.hindustanijyotish.com/v1 (see
# hj_core AppConfig). This file previously declared only
# `api.hindustanijyotish.com`, so the vhost really serving `fastapi.` was a
# DIFFERENT config without the WebSocket block below — REST worked while
# every chat socket got a non-101 response and the apps sat on
# "Reconnecting…"/"Connecting…" forever. If you add another hostname, add it
# to server_name here too (and to the certificate) rather than creating a
# separate server block that will drift.
#
# Verify after reloading:  ./deploy/verify_websocket.sh fastapi.hindustanijyotish.com

# Map the Upgrade request header → the Connection header value the upstream
# needs. When Upgrade is absent (normal HTTP) Connection is left empty so
# keep-alive still works; when present it becomes "upgrade" (WebSocket).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream hindustani_jyotish_backend {
    # gunicorn binds here (see gunicorn_conf.py / the systemd unit).
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name fastapi.hindustanijyotish.com api.hindustanijyotish.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fastapi.hindustanijyotish.com api.hindustanijyotish.com;

    # ── TLS (certbot-managed) ────────────────────────────────────────────
    # Must cover EVERY name in server_name above, e.g.
    #   certbot --nginx -d fastapi.hindustanijyotish.com -d api.hindustanijyotish.com
    # (certbot names the directory after the FIRST -d argument).
    ssl_certificate     /etc/letsencrypt/live/fastapi.hindustanijyotish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fastapi.hindustanijyotish.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Uploads: KYC docs, avatars, generated Kundli PDFs.
    client_max_body_size 25m;

    # Generated media (PDFs, avatars) — served directly if you expose MEDIA_ROOT.
    # location /media/ { alias /opt/hindustani_jyotish/app/hindustani_jyotish_backen_fastapi/media/; }

    # ── WebSocket endpoints ──────────────────────────────────────────────
    # Consultation chat + live-broadcast chat. These MUST carry the Upgrade /
    # Connection headers and want long read timeouts (idle sockets between
    # messages) with buffering off so frames flush immediately.
    #
    # `broadcasts/[^/]+/chat` is the current live-streaming chat path — the
    # feature was renamed from `live` to `broadcasts` when it was rebuilt,
    # and this regex not being updated at the same time meant every
    # broadcast-chat WebSocket silently fell through to the generic location
    # block below instead: no proxy_buffering off, and only a 60s
    # proxy_read_timeout instead of the long one WS connections need, so
    # nginx force-closed the connection well before either side intended,
    # producing an endless connect → ~60s → drop → reconnect loop. `live/`
    # is kept alongside it (harmless, matches nothing now) in case any
    # older client build is still pointed at the retired path.
    location ~ ^/v1/(consultations/[^/]+/ws|live/[^/]+/chat|broadcasts/[^/]+/chat)$ {
        proxy_pass http://hindustani_jyotish_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;   # keep idle chat sockets open up to 1h
        proxy_send_timeout 3600s;
    }

    # ── Everything else (regular HTTP/JSON API) ──────────────────────────
    location / {
        proxy_pass http://hindustani_jyotish_backend;
        proxy_http_version 1.1;
        # Also set upgrade headers here so a WS path not matched above still
        # upgrades correctly; harmless for plain HTTP thanks to the map.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
