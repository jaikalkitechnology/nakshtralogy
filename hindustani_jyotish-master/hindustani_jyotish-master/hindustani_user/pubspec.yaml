name: hindustani_user
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Bundled localizations (Material/Cupertino/Widgets) + ARB-generated strings.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Google Sign-In ("Continue with Google"). Returns the id_token we POST to
  # /auth/google. serverClientId is set at call sites (see google_auth.dart).
  google_sign_in: ^6.2.1

  # Web implementation of google_sign_in, made a direct dependency (it's
  # already pulled in transitively) so we can call its web-only
  # `renderButton()` API. `signIn()` is deprecated on web and never returns an
  # `idToken` there (see google_web_button_web.dart); the GIS credential
  # button is the only web path that yields one.
  google_sign_in_web: ^0.12.4

  # Shared core (theme, models, network, auth)
  hj_core:
    path: ../hj_core

  # State / DI / routing / network
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  web_socket_channel: ^3.0.1

  # Push notifications (FCM). Android config comes from google-services.json.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Real system-tray notifications for foreground FCM messages (Android auto-
  # displays a system notification for background/terminated messages, but a
  # foreground message needs to be shown explicitly).
  flutter_local_notifications: ^18.0.1

  # Wallet recharge checkout sheet (Razorpay). Device-only; degrades gracefully
  # on web/desktop where the platform channel is unavailable.
  razorpay_flutter: ^1.3.7

  # Same Agora RTC engine hj_core's AgoraCallService wraps — declared directly
  # here too so the consultation call screen can drive the earpiece/speaker
  # toggle via `AgoraCallService.engine` (a plain RtcEngine call with no seam
  # in hj_core for it). Version pinned to match hj_core's.
  agora_rtc_engine: ^6.5.2

  # Injectable "now" for the consultation call screen's wall-clock-based
  # heartbeat cadence (see consultation_screen.dart) — real `DateTime.now()`
  # in production, a fixed/advanceable clock in widget tests, so the
  # 60-second billing cadence and background-resync logic are testable
  # without a test actually sleeping for real minutes.
  clock: ^1.1.2

  # Biometric app-lock + high-value recharge gate. Device-only; falls back to
  # allowing access when no biometric/credential is enrolled.

  # Profile-photo picker (Complete Profile DP step, uploads via
  # POST /me/avatar). Same version as the astrologer app's KYC/settings
  # avatar picker.
  image_picker: ^1.1.2

  # Home-screen "Featured videos" carousel playback (GET /promo-videos).
  video_player: ^2.9.2

  # Opens the admin-configured social links (Profile → "Follow us") in the
  # external browser/app.
  url_launcher: ^6.3.1
  youtube_player_iframe: ^6.0.2
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Generates every launcher/PWA icon size from credentials/user.png (copied
  # to assets/launcher/). Regenerate after replacing the artwork with:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generate AppLocalizations from the ARB files in lib/l10n (see l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# App icon generation — source artwork lives in ../credentials/user.png and is
# copied to assets/launcher/icon.png (full-bleed) + icon_fg.png (66% safe-zone
# version for the Android adaptive foreground; its own saffron square blends
# into the matching adaptive background color, sampled from the artwork).
flutter_launcher_icons:
  image_path: "assets/launcher/icon.png"
  android: true
  adaptive_icon_background: "#CE7000"
  adaptive_icon_foreground: "assets/launcher/icon_fg.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/launcher/icon.png"
    background_color: "#CE7000"
    theme_color: "#CE7000"
