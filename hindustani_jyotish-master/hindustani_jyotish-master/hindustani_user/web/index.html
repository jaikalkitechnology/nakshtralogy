<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Hindustani Jyotish - talk to verified Vedic astrologers over chat, call and video.">
  <meta name="theme-color" content="#0B0A1F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hindustani Jyotish">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hindustani Jyotish</title>
  <link rel="manifest" href="manifest.json">

  <!-- NO inline Firebase init here, deliberately. This page used to call
       firebase.initializeApp() with a hardcoded config (whose appId was a
       placeholder of zeroes, so it could never match a real Firebase web
       app). That created the DEFAULT Firebase app before Flutter booted, so
       the Dart-side Firebase.initializeApp(options: …) — which now fetches
       the real, admin-configured web credentials at runtime (admin console →
       Firebase → Web app config) — could only be ignored or collide with it.
       The Dart side is the single source of truth; firebase_core loads the
       JS SDK itself. -->
</head>
<body>
  <!-- Agora Web SDK (iris-web-rtc) — REQUIRED for audio/video calls and live
       streaming on web. agora_rtc_engine's web support is a thin wrapper over
       this bundle: without it every call/live screen fails at engine init
       with an AgoraRtcException instead of connecting. Mobile builds don't
       use this at all (they link the native SDK).

       Version pinned to the one agora_rtc_engine 6.5.4 is built against (see
       its README/example) — do not bump it independently of the plugin.

       Loaded from Agora's official CDN. To remove the runtime CDN dependency,
       download this exact file into `web/` and change src to the relative
       path "iris-web-rtc_n450_w4220_0.8.6.js"; nothing else needs to change.
       It is a plain (non-async) script so it is guaranteed to have executed
       before Flutter boots below. -->
  <script src="https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
