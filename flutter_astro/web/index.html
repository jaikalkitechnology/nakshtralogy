<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nakshatralogy Pro - the astrologer console for Vedic charts, live consultations, chat, and audio/video calls with your clients.">
  <meta name="theme-color" content="#0A0A24">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nakshatralogy Pro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nakshatralogy for Astrologers</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Branded PWA install banner (Chrome/Edge desktop) + iOS A2HS hint. */
    #nk-install-banner {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      z-index: 2147483647; display: none; align-items: center; gap: 14px;
      max-width: 92%; padding: 12px 16px;
      background: #12123a; color: #F5EEE0;
      border: 1px solid #2D2458; border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #nk-install-banner .nk-ic {
      width: 40px; height: 40px; border-radius: 10px; flex: 0 0 auto;
    }
    #nk-install-banner .nk-tx { font-size: 14px; line-height: 1.35; }
    #nk-install-banner .nk-tx b { color: #E8B547; display: block; font-size: 15px; }
    #nk-install-banner button {
      cursor: pointer; border: none; border-radius: 10px;
      padding: 9px 16px; font-size: 14px; font-weight: 600;
    }
    #nk-install-yes { background: #E8B547; color: #0A0A24; }
    #nk-install-no  { background: transparent; color: #8A8298; }
  </style>
</head>
<body>
  <!-- Branded install / Add-to-Home-Screen banner -->
  <div id="nk-install-banner" role="dialog" aria-label="Install Nakshatralogy Pro">
    <img class="nk-ic" src="icons/Icon-192.png" alt="Nakshatralogy Pro"/>
    <div class="nk-tx">
      <b>Install Nakshatralogy Pro</b>
      <span id="nk-install-msg">Add the astrologer console to your device for a full-screen, app-like experience.</span>
    </div>
    <button id="nk-install-yes">Install</button>
    <button id="nk-install-no" aria-label="Dismiss">Not now</button>
  </div>

  <script>
    (function () {
      var banner = document.getElementById('nk-install-banner');
      var yes = document.getElementById('nk-install-yes');
      var no = document.getElementById('nk-install-no');
      var msg = document.getElementById('nk-install-msg');
      var deferredPrompt = null;
      var DISMISS_KEY = 'nk_pwa_install_dismissed';

      function isStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches ||
               window.navigator.standalone === true;
      }
      function dismissed() {
        try { return localStorage.getItem(DISMISS_KEY) === '1'; } catch (e) { return false; }
      }
      function hide() { banner.style.display = 'none'; }
      function show() { if (!dismissed() && !isStandalone()) banner.style.display = 'flex'; }

      // Chrome / Edge desktop + Android: capture the native prompt.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        yes.style.display = '';
        show();
      });

      yes.addEventListener('click', function () {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.finally(function () { deferredPrompt = null; hide(); });
        } else {
          hide();
        }
      });
      no.addEventListener('click', function () {
        try { localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
        hide();
      });
      window.addEventListener('appinstalled', function () {
        try { localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
        hide();
      });

      // iOS Safari has no beforeinstallprompt — show a manual A2HS hint.
      var ua = window.navigator.userAgent.toLowerCase();
      var isIOS = /iphone|ipad|ipod/.test(ua);
      var isSafari = /safari/.test(ua) && !/crios|fxios|edgios/.test(ua);
      if (isIOS && isSafari && !isStandalone() && !dismissed()) {
        yes.style.display = 'none';
        msg.textContent = 'Tap the Share icon, then "Add to Home Screen" to install.';
        show();
      }
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
