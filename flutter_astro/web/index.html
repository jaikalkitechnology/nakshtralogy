<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nakshatralogy Astro - the astrologer console for Vedic charts, live consultations, chat, and audio/video calls with your clients.">
  <meta name="theme-color" content="#0A0A24">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nakshatralogy Astro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">

  <!-- Favicon (brand app icon). ?v bumps bypass the browser's aggressive
       favicon cache after a redeploy. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=3"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=3"/>

  <title>Nakshatralogy Astro</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Branded PWA install banner (Chrome/Edge desktop) + iOS A2HS hint. */
    #nk-install-banner {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      z-index: 2147483647; display: none; align-items: center; gap: 14px;
      max-width: 92%; padding: 12px 16px;
      background: #12123a; color: #F5EEE0;
      border: 1px solid #2D2458; border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #nk-install-banner .nk-ic {
      width: 40px; height: 40px; border-radius: 10px; flex: 0 0 auto;
    }
    #nk-install-banner .nk-tx { font-size: 14px; line-height: 1.35; }
    #nk-install-banner .nk-tx b { color: #E8B547; display: block; font-size: 15px; }
    #nk-install-banner button {
      cursor: pointer; border: none; border-radius: 10px;
      padding: 9px 16px; font-size: 14px; font-weight: 600;
    }
    #nk-install-yes { background: #E8B547; color: #0A0A24; }
    #nk-install-no  { background: transparent; color: #8A8298; }
    /* Branded startup splash — replaces the blank white screen while Flutter
       boots. Removed on the first rendered frame. */
    #nk-splash {
      position: fixed; inset: 0; z-index: 2147483646;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, #15152e 0%, #0B0B1F 70%);
      transition: opacity .5s ease; opacity: 1;
    }
    #nk-splash.nk-hide { opacity: 0; pointer-events: none; }
    .nk-splash-wrap { position: relative; width: 128px; height: 128px; display: flex; align-items: center; justify-content: center; }
    .nk-splash-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid rgba(212,175,55,0.15); border-top-color: #D4AF37;
      animation: nk-spin 1s linear infinite;
    }
    .nk-splash-icon { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.5); animation: nk-pulse 1.6s ease-in-out infinite; }
    .nk-splash-title { margin-top: 24px; color: #E8B547; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 3px; }
    .nk-splash-sub { margin-top: 6px; color: #8888a0; font-size: 12px; letter-spacing: .5px; }
    @keyframes nk-spin { to { transform: rotate(360deg); } }
    @keyframes nk-pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.92); opacity: .85; } }
  </style>
</head>
<body>
  <!-- Branded loading splash (hidden once Flutter renders its first frame) -->
  <div id="nk-splash">
    <div class="nk-splash-wrap">
      <div class="nk-splash-ring"></div>
      <img class="nk-splash-icon" src="icons/Icon-256.png?v=3" alt="Nakshatralogy Astro"/>
    </div>
    <div class="nk-splash-title">NAKSHATRALOGY ASTRO</div>
    <div class="nk-splash-sub">Astrologer Console · loading…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('nk-splash');
      if (s) { s.classList.add('nk-hide'); setTimeout(function () { s.remove(); }, 600); }
    });
  </script>
  <!-- Branded install / Add-to-Home-Screen banner -->
  <div id="nk-install-banner" role="dialog" aria-label="Install Nakshatralogy Astro">
    <img class="nk-ic" src="icons/Icon-192.png?v=3" alt="Nakshatralogy Astro"/>
    <div class="nk-tx">
      <b>Install Nakshatralogy Astro</b>
      <span id="nk-install-msg">Add the astrologer console to your device for a full-screen, app-like experience.</span>
    </div>
    <button id="nk-install-yes">Install</button>
    <button id="nk-install-no" aria-label="Dismiss">Not now</button>
  </div>

  <script>
    (function () {
      var banner = document.getElementById('nk-install-banner');
      var yes = document.getElementById('nk-install-yes');
      var no = document.getElementById('nk-install-no');
      var msg = document.getElementById('nk-install-msg');
      var deferredPrompt = null;
      var DISMISS_KEY = 'nk_pwa_install_dismissed';

      function isStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches ||
               window.navigator.standalone === true;
      }
      function dismissed() {
        try { return localStorage.getItem(DISMISS_KEY) === '1'; } catch (e) { return false; }
      }
      function hide() { banner.style.display = 'none'; }
      function show() { if (!dismissed() && !isStandalone()) banner.style.display = 'flex'; }

      // Chrome / Edge desktop + Android: capture the native prompt.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        yes.style.display = '';
        show();
      });

      yes.addEventListener('click', function () {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.finally(function () { deferredPrompt = null; hide(); });
        } else {
          hide();
        }
      });
      no.addEventListener('click', function () {
        try { localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
        hide();
      });
      window.addEventListener('appinstalled', function () {
        try { localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
        hide();
      });

      // iOS Safari has no beforeinstallprompt — show a manual A2HS hint.
      var ua = window.navigator.userAgent.toLowerCase();
      var isIOS = /iphone|ipad|ipod/.test(ua);
      var isSafari = /safari/.test(ua) && !/crios|fxios|edgios/.test(ua);
      if (isIOS && isSafari && !isStandalone() && !dismissed()) {
        yes.style.display = 'none';
        msg.textContent = 'Tap the Share icon, then "Add to Home Screen" to install.';
        show();
      }
    })();
  </script>

  <!--
    Agora Web SDK (iris-web) — REQUIRED for agora_rtc_engine on Flutter Web.
    Without this bridge, createAgoraRtcEngine().initialize() fails in the browser
    and audio/video calls + live streaming silently fall back to "unsupported".
    The build number MUST match the resolved agora_rtc_engine version
    (pubspec.lock = 6.5.3 → iris n450_w4220_0.8.6). Loaded before the Flutter
    bootstrap so the SDK is present when the engine initialises.
  -->
  <script src="https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js"></script>

  <!--
    iOS Safari fix for a BLACK live-stream / video-call screen.
    Agora's web SDK inserts <video> elements dynamically. On iOS Safari a <video>
    without the `playsinline` attribute is NOT rendered inline (it stays black /
    tries to go fullscreen), which is why the camera preview worked on Android web
    but showed black on iOS. This observer stamps playsinline + autoplay on every
    Agora video element as it appears and (re)starts muted playback (muted
    autoplay is always allowed on iOS), so the preview renders correctly.
  -->
  <script>
    (function () {
      function fix(v) {
        try {
          v.setAttribute('playsinline', '');
          v.setAttribute('webkit-playsinline', '');
          v.setAttribute('autoplay', '');
          v.setAttribute('muted', '');
          v.playsInline = true;
          // iOS Safari rejects play() on a <video> that carries an audio track
          // unless it is muted. Agora renders REMOTE audio through a separate
          // element, so muting the video element keeps sound and lets the
          // remote (client's) video render in a video call (was black on iOS).
          v.muted = true;
          if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
          // Re-apply on the media events iOS fires when Agora binds/rebinds a
          // track. Without this the FIRST play() (before we muted) is rejected
          // and the element stays black until the slow poll; re-fixing on
          // loadedmetadata/canplay/stalled un-blacks it the instant it can play.
          if (!v.__nkBound) {
            v.__nkBound = true;
            ['loadedmetadata', 'canplay', 'stalled', 'suspend', 'emptied'].forEach(function (ev) {
              v.addEventListener(ev, function () { fix(v); });
            });
            // iOS PWA: a <video> bound to a WebRTC MediaStream is often present
            // but BLACK (the first frame never paints). Re-binding srcObject
            // forces iOS to paint. Kicks only while it still looks black.
            setTimeout(function () { kick(v); }, 300);
            setTimeout(function () { kick(v); }, 1200);
            setTimeout(function () { kick(v); }, 2500);
          }
        } catch (e) {}
      }
      // Force the first frame on iOS by re-attaching the MediaStream. No-op once
      // the video is actually rendering (videoWidth>0 and playing).
      function kick(v) {
        try {
          var s = v.srcObject;
          if (!s) return;
          if (v.videoWidth > 0 && !v.paused) return; // already rendering
          v.srcObject = null;
          v.srcObject = s;
          v.muted = true;
          v.playsInline = true;
          var p = v.play(); if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      }
      function scan() { document.querySelectorAll('video').forEach(fix); }
      var obs = new MutationObserver(function () { scan(); });
      if (document.body) obs.observe(document.body, { childList: true, subtree: true });
      document.addEventListener('DOMContentLoaded', function () {
        obs.observe(document.body, { childList: true, subtree: true });
        scan();
      });
      setInterval(scan, 800); // safety net for elements added between mutations
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
