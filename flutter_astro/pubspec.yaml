name: nakshatralogy_astro
description: "Nakshtralogy - Astrologer Panel"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_sign_in: ^6.2.1
  web_socket_channel: ^3.0.0
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.3.0
  image_picker: ^1.0.7
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  # Full-screen native incoming-call UI (CallKit on iOS, ConnectionService on
  # Android). On iOS it also registers the PushKit VoIP token used to wake the
  # app for a call while it is killed/backgrounded — the one thing FCM cannot do.
  flutter_callkit_incoming: ^2.5.0
  local_auth: ^2.3.0
  url_launcher: ^6.2.5
  app_links: ^6.3.0
  file_picker: ^8.1.2
  # Keeps the screen awake for the duration of a live broadcast — without it
  # the device's normal screen-timeout dims/locks the astrologer's screen
  # mid-session, which on most devices also suspends the camera preview.
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  adaptive_icon_background: "assets/icon/ic_launcher_background.png"
  min_sdk_android: 21
